apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
      - image: httpd:latest
        name: {{ .Release.Name }}
        ports:
        - containerPort: 80
        imagePullPolicy: {{ .Values.image.pullPolicy }}
      initContainers:
        - name: init-container
          image: busybox
          command: ['sh', '-c', 'echo Hello world']

